<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Car wash logo">
  <defs>
    <linearGradient id="cw-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3f86" />
      <stop offset="1" stop-color="#0a1c44" />
    </linearGradient>
    <linearGradient id="cw-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc542" />
      <stop offset="1" stop-color="#f3921c" />
    </linearGradient>
    <linearGradient id="cw-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8f2ff" />
      <stop offset="1" stop-color="#63b6f2" />
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="32" fill="url(#cw-bg)" />

  <!-- bubbles -->
  <g fill="#9fdcff">
    <circle cx="18.5" cy="19" r="3.2" opacity=".9" />
    <circle cx="29.5" cy="12.5" r="2" opacity=".75" />
    <circle cx="39" cy="15" r="2.6" opacity=".85" />
    <circle cx="46.5" cy="22" r="1.7" opacity=".7" />
    <circle cx="14" cy="27.5" r="1.5" opacity=".6" />
  </g>

  <!-- car cabin -->
  <path d="M21.5 35 26 27.8A4 4 0 0 1 29.6 26h4.8a4 4 0 0 1 3.6 1.8L42.5 35Z" fill="url(#cw-body)" />
  <!-- window -->
  <path d="M25.2 33 28.2 28.6a2 2 0 0 1 1.7-.9h4.2a2 2 0 0 1 1.7.9l3 4.4Z" fill="url(#cw-glass)" />
  <!-- body -->
  <rect x="12" y="35" width="40" height="12" rx="4" fill="url(#cw-body)" />
  <!-- highlight -->
  <rect x="15" y="37" width="34" height="2.6" rx="1.3" fill="#fff" opacity=".35" />
  <!-- wheels -->
  <circle cx="22" cy="47" r="4.6" fill="#0a1c44" />
  <circle cx="22" cy="47" r="1.9" fill="#9fdcff" />
  <circle cx="42" cy="47" r="4.6" fill="#0a1c44" />
  <circle cx="42" cy="47" r="1.9" fill="#9fdcff" />
</svg>
